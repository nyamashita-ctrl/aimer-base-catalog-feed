name: Build product feed

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed.csv
        run: python build_feed.py feed.csv
      # Always commit a build stamp: GitHub disables scheduled workflows after
      # 60 days without repository activity, and a stable catalog would otherwise
      # go silent without anyone noticing.
      - name: Commit feed and build stamp
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%MZ > .last_build
          git add feed.csv .last_build
          if git diff --cached --quiet -- feed.csv; then
            msg="Build stamp $(cat .last_build) (feed unchanged)"
          else
            msg="Update feed.csv ($(cat .last_build))"
          fi
          git commit -m "$msg"
          git push
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_TOKEN: ${{ secrets.CI_ALERT_SLACK_TOKEN || secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_TOKEN" ]; then echo "::warning::CI_ALERT_SLACK_TOKEN is not set; skipped the Slack alert"; exit 0; fi
          text=$(printf ':rotating_light: <@U04FLQ96UV6> GitHub Actions が失敗しました。ログを確認してください: %s / %s\n%s' "${GITHUB_REPOSITORY#*/}" "$GITHUB_WORKFLOW" "$RUN_URL")
          jq -n --arg channel C0BTFL5RN20 --arg text "$text" '{channel: $channel, text: $text}' \
            | curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
                --data @- | jq -r '"slack ok=\(.ok) \(.error // "")"'
