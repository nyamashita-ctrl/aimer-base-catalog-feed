name: Build product feed

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 JST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed.csv
        run: python build_feed.py feed.csv
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          if git diff --quiet -- feed.csv; then
            echo "feed unchanged"
          else
            git add feed.csv
            git commit -m "Update feed.csv ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
